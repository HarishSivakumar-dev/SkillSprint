services:
  db:
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: HarishSathiya@07
      MYSQL_USER: Harish
      MYSQL_DATABASE: userinfo
      MYSQL_PASSWORD: HarishSathiya@07
    container_name: skillsprint-db-1
    networks:
      - skillsprint-network
    ports:
      - "3307:3306"
    volumes:
      - dbvol:/var/lib/mysql 
  app:
    build:
      context: .
    image: skillsprint:v1
    networks:
      - skillsprint-network
    depends_on:
      - db
      - redis
    restart: always
    expose:
      - "8080"
  redis:
    image: redis:8
    container_name: skillsprint-redis-1
    environment:
      REDIS_PASSWORD: HarishSathiya@07
    command: ["redis-server", "--requirepass", "HarishSathiya@07"]
    networks:
      - skillsprint-network
    ports:
      - "6379:6379"
volumes:
  dbvol:

networks:
  skillsprint-network:
    driver: bridge