events {}

http {
    upstream server_instance{

        least_conn;
        server app1:3001;
        server app2:3002;
        server app3:3003;
    }


    server{

        listen 8080;
        server_name localhost;

        location / {
           proxy_pass http://server_instance;
           proxy_set_header Host $host;
        }

    }

}