events {}

http {
    upstream server_instance{

        least_conn;
        server app1:3001;
        server app2:3002;
        server app3:3003;
    }


    server{

        include mime.types;

        listen 443 ssl;
        server_name localhost;

        ssl_certificate /nginx_certs/nginx-selfsigned.cert;
        ssl_certificate_key /nginx_certs/nginx-selfsigned.key;
        keepalive_time 20s;

        location / {

          root /frontend/www/static;
          try_files $uri $uri/ /index.html;

        }

        location /app/ {
                proxy_pass http://server_instance;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

    }

    server{

        listen 80;
        server_name localhost;

        location /{
            return 308 https://$host$request_uri;
        }

    }

}